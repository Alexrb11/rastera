[workspace]
members = ["crates/rastera-core", "crates/rastera-engine", "crates/rastera-adapters", "crates/rastera-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
rastera-core = { path = "crates/rastera-core" }
rastera-engine = { path = "crates/rastera-engine" }
rastera-adapters = { path = "crates/rastera-adapters" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
crossbeam-channel = "0.5.15"
tempfile = "3.23"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

