name: Proponer una mejora
description: Un problema de uso que Rastera podría resolver.
title: "[Mejora] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema y caso de uso
      description: Qué intentas hacer, con qué imágenes y qué te dificulta el trabajo.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Comportamiento propuesto
      description: Describe el resultado útil y cualquier alternativa que hayas probado.
    validations:
      required: true
