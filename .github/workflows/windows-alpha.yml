name: Desktop alpha

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy, rust-docs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - name: Validate alpha version and tag
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+-alpha\.\d+$') { throw 'Expected an alpha version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and workspace version differ.' }
      - name: Build normal MSVC binary and portable package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Target x86_64-pc-windows-msvc
      - name: Verify package integrity and executable with isolated PATH
        shell: pwsh
        run: |
          $archive = (Get-ChildItem work/releases/*.zip).FullName
          ./scripts/verify-portable.ps1 -Archive $archive -InspectOnly -ReportPath work/releases/verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-alpha
          if-no-files-found: error
          path: |
            work/releases/*.zip
            work/releases/*.zip.sha256
            work/releases/verification.json

  package-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64-alpha
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64-alpha
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x64-alpha
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy, rust-docs
      - name: Linux build and desktop smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # winit loads these X11 libraries at runtime; ldd does not list them.
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libx11-6 libx11-xcb1 libxcursor1 libxi6 libxcb1 \
            libvulkan1 mesa-vulkan-drivers libegl1 libgl1 xvfb dbus-x11 \
            xdg-desktop-portal xdg-desktop-portal-gtk zenity
      - name: Validate alpha version and tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+-alpha\.\d+', version):
              raise SystemExit('Expected an alpha version')
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != 'v' + version:
              raise SystemExit('Tag and workspace version differ')
          PY
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Build package on native architecture
        run: python3 scripts/package-unix.py --target ${{ matrix.target }} --output work/releases
      - name: Verify Linux package and start the desktop under Xvfb
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 scripts/verify-unix-package.py --archive work/releases/*.tar.gz --smoke --expected-commit "$GITHUB_SHA" --report work/releases/verification.json
      - name: Verify macOS bundle, signature and isolated build-info
        if: runner.os == 'macOS'
        run: python3 scripts/verify-unix-package.py --archive work/releases/*.zip --expected-commit "$GITHUB_SHA" --report work/releases/verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            work/releases/*.zip
            work/releases/*.zip.sha256
            work/releases/*.tar.gz
            work/releases/*.tar.gz.sha256
            work/releases/verification.json

  draft-release:
    if: github.ref_type == 'tag'
    needs: [package, package-unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-alpha'
          path: work/release-assets
      - name: Create prerelease draft with all native packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" work/release-assets/*/*.zip work/release-assets/*/*.zip.sha256 work/release-assets/*/*.tar.gz work/release-assets/*/*.tar.gz.sha256
          else
            gh release create "$RELEASE_TAG" work/release-assets/*/*.zip work/release-assets/*/*.zip.sha256 work/release-assets/*/*.tar.gz work/release-assets/*/*.tar.gz.sha256 --verify-tag --draft --prerelease --title "Rastera $version" --notes-file "docs/releases/$version.md"
          fi
